# Hooks run locally with `pre-commit install` and on every PR by pre-commit.ci.
ci:
  autofix_prs: true          # pre-commit.ci pushes whitespace/EOF fixes to PRs
  autoupdate_schedule: monthly
  autofix_commit_msg: "style: auto fixes from pre-commit hooks"
  autoupdate_commit_msg: "chore: pre-commit autoupdate"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: mixed-line-ending

  # Blocks committed secrets (API keys, tokens). Important for a security
  # research repo where test credentials can slip in.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
